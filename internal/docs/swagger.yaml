basePath: /api
definitions:
  bucket.Create:
    properties:
      color:
        type: string
      is_default:
        type: boolean
      layout:
        type: string
      max_tasks:
        type: integer
      subtitle:
        type: string
      title:
        type: string
    type: object
  bucket.Response:
    properties:
      color:
        type: string
      is_default:
        type: boolean
      layout:
        type: string
      max_tasks:
        type: integer
      name:
        type: string
      position:
        type: number
      subtitle:
        type: string
      title:
        type: string
    type: object
  bucket.Update:
    properties:
      color:
        type: string
      is_default:
        type: boolean
      layout:
        type: string
      max_tasks:
        type: integer
      position:
        type: number
      subtitle:
        type: string
      title:
        type: string
    type: object
  common.ErrorResponse:
    properties:
      detail:
        type: string
    type: object
  project.Create:
    properties:
      done_clean_period:
        type: integer
      git_remote:
        type: string
      title:
        type: string
    type: object
  project.Response:
    properties:
      created_at:
        type: string
      done_clean_period:
        type: integer
      git_remote:
        type: string
      id:
        type: string
      title:
        type: string
    type: object
  project.Update:
    properties:
      done_clean_period:
        type: integer
      git_remote:
        type: string
      title:
        type: string
    type: object
  settings.AppSettings:
    properties:
      currentTheme:
        type: string
      gitRemoteUrl:
        type: string
      hideAddTaskButton:
        type: boolean
      hideArchiveColumn:
        type: boolean
      hideDoneColumn:
        type: boolean
      isSidebarOpen:
        type: boolean
      language:
        type: string
      pinnedProjectIds:
        items:
          type: string
        type: array
      projectOrder:
        items:
          type: string
        type: array
      sortBy:
        type: string
      thresholdDays:
        type: integer
      windowHeight:
        type: integer
      windowMaximized:
        type: boolean
      windowWidth:
        type: integer
      windowX:
        type: integer
      windowY:
        type: integer
    type: object
  task.Create:
    properties:
      body:
        type: string
      bucket:
        type: string
      color:
        type: string
      due_date:
        type: string
      planned_date:
        type: string
      priority:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  task.Move:
    properties:
      bucket:
        type: string
      position:
        type: number
    type: object
  task.Response:
    properties:
      attachments:
        items:
          type: string
        type: array
      body:
        type: string
      bucket:
        type: string
      color:
        type: string
      created_at:
        type: string
      due_date:
        type: string
      id:
        type: string
      planned_date:
        type: string
      position:
        type: number
      priority:
        type: string
      project_id:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  task.Update:
    properties:
      attachments:
        items:
          type: string
        type: array
      body:
        type: string
      bucket:
        type: string
      color:
        type: string
      due_date:
        type: string
      planned_date:
        type: string
      position:
        type: number
      priority:
        type: string
      project_id:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
info:
  contact:
    name: Simon
    url: https://github.com/simon123h/jotter
  description: Local-first Markdown Kanban Board backend API.
  license:
    name: MIT
    url: https://github.com/simon123h/jotter/blob/main/LICENSE.md
  termsOfService: http://swagger.io/terms/
  title: Jotter API
  version: 2.9.1
paths:
  /projects:
    get:
      description: Get a list of all active projects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.Response'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get all projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new workspace project board with default buckets
      parameters:
      - description: Create Project Request
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/project.Create'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Create a new project
      tags:
      - projects
  /projects/{project_id}:
    delete:
      description: Delete a project board and remove its local database cache index
        entries
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Delete a project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update project metadata (title, clean period, or Git remote)
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Update Project Request
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/project.Update'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Update a project
      tags:
      - projects
  /projects/{project_id}/buckets:
    get:
      description: Get a list of all columns/buckets for the specified project
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/bucket.Response'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get all buckets of a project
      tags:
      - buckets
    post:
      consumes:
      - application/json
      description: Create a new column/bucket in the specified project
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Create Bucket Request
        in: body
        name: bucket
        required: true
        schema:
          $ref: '#/definitions/bucket.Create'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/bucket.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Create a new bucket
      tags:
      - buckets
  /projects/{project_id}/buckets/{name}:
    delete:
      description: Delete a column/bucket from the project. The column must be empty.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Bucket Name (slug)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Delete a bucket
      tags:
      - buckets
    put:
      consumes:
      - application/json
      description: Update metadata or position of a bucket/column
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Bucket Name (slug)
        in: path
        name: name
        required: true
        type: string
      - description: Update Bucket Request
        in: body
        name: bucket
        required: true
        schema:
          $ref: '#/definitions/bucket.Update'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bucket.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Update a bucket
      tags:
      - buckets
  /projects/{project_id}/tasks:
    get:
      description: Retrieve tasks for the specified project, with support for filtering
        by bucket, excluding buckets, and priorities
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Filter by bucket name
        in: query
        name: bucket
        type: string
      - description: Exclude specific bucket
        in: query
        name: exclude_bucket
        type: string
      - description: Comma-separated list of bucket names to exclude
        in: query
        name: exclude_buckets
        type: string
      - description: Comma-separated list of priorities to filter by
        in: query
        name: priorities
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.Response'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get tasks of a specific project
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task under the specified project and bucket
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Create Task Request
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/task.Create'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Create a new task
      tags:
      - tasks
  /projects/{project_id}/tasks/{task_id}:
    delete:
      description: Delete a task by ID, including its markdown file and index
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Retrieve detailed information about a specific task by its ID
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get task by ID
      tags:
      - tasks
    put:
      consumes:
      - application/json
      description: Update a task's fields or metadata. Supports both PUT and PATCH
        behaviors.
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Update Task Request
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/task.Update'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Update a task
      tags:
      - tasks
  /projects/{project_id}/tasks/{task_id}/attachments:
    post:
      consumes:
      - multipart/form-data
      description: Upload a file as an attachment to the specified task (multipart/form-data)
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Upload an attachment to a task
      tags:
      - tasks
  /projects/{project_id}/tasks/{task_id}/attachments/{filename}:
    delete:
      description: Delete the specified attachment file of a task
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Attachment file name
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Delete task attachment
      tags:
      - tasks
    get:
      description: Serve/download the specified attachment file of a task
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Attachment file name
        in: path
        name: filename
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get task attachment file
      tags:
      - tasks
  /projects/{project_id}/tasks/{task_id}/move:
    patch:
      consumes:
      - application/json
      description: Move a task to a different bucket or change its relative position
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: string
      - description: Task ID
        in: path
        name: task_id
        required: true
        type: string
      - description: Move Task Request
        in: body
        name: move
        required: true
        schema:
          $ref: '#/definitions/task.Move'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Move/reorder a task
      tags:
      - tasks
  /settings:
    get:
      description: Get global user settings for the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/settings.AppSettings'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get user settings
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Update and save global user settings
      parameters:
      - description: User Settings
        in: body
        name: settings
        required: true
        schema:
          $ref: '#/definitions/settings.AppSettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Save user settings
      tags:
      - settings
  /system/info:
    get:
      description: Get currently running version of Jotter and the data directory
        path.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get system info
      tags:
      - system
  /system/sync:
    post:
      description: Trigger a complete bidirectional sync. It parses task markdown
        files to rebuild the SQLite DB index, and fetches/merges/pushes active Git
        remotes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/common.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Synchronize system index and Git
      tags:
      - system
  /tasks:
    get:
      description: Retrieve tasks across all projects with filters (e.g. exclude certain
        buckets)
      parameters:
      - description: Comma-separated list of bucket names to exclude
        in: query
        name: exclude_buckets
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.Response'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/common.ErrorResponse'
      summary: Get all tasks across all projects
      tags:
      - tasks
swagger: "2.0"
