stages:
  - test

backend-tests:
  stage: test
  image: python:3.12
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - backend/.venv/
  before_script:
    - cd backend
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install -r requirements.txt
    - pip install pytest-cov
  script:
    - PYTHONPATH=. pytest --cov=. --cov-report=xml --cov-report=term test_main.py
    # Upload backend coverage to Codecov
    - curl -Os https://uploader.codecov.io/latest/linux/codecov
    - chmod +x codecov
    - ./codecov -t ${CODECOV_TOKEN} -F backend

frontend-tests:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm install
  script:
    - npm run test -- --coverage
    # Upload frontend coverage to Codecov
    - curl -Os https://uploader.codecov.io/latest/linux/codecov
    - chmod +x codecov
    - ./codecov -t ${CODECOV_TOKEN} -F frontend
