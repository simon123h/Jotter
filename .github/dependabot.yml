version: 2
updates:
  # Maintain Python dependencies in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain npm dependencies of the root, every app and every shared package. The globs pick up a new app or package
  # (each has its own package.json) without this file having to change.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # TypeScript 7 waits for ESLint (typescript-eslint) to support it; remove this when it does
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # The tooling every app and package shares moves together, majors included: one PR across the directories
      # instead of one per app (a TypeScript major was three PRs). This group is listed first, so it wins for these.
      npm-shared-tooling:
        patterns:
          - "typescript"
          - "vue-tsc"
          - "@vue/tsconfig"
          - "vitest"
          - "@vitest/*"
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "@types/node"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
