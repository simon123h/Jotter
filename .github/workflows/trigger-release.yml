name: 🚀 Trigger Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version (only if "custom" selected above, e.g. v3.1.0-rc.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Next Semantic Version Tag
        id: semver
        shell: bash
        run: |
          # Find latest stable semver tag
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v3.0.0"
          fi
          echo "Latest tag: $LATEST_TAG"

          # Strip leading 'v'
          RAW_VER="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"

          BUMP="${{ github.event.inputs.bump }}"
          CUSTOM="${{ github.event.inputs.custom_version }}"

          if [ "$BUMP" = "patch" ]; then
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          elif [ "$BUMP" = "minor" ]; then
            NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
          elif [ "$BUMP" = "major" ]; then
            NEW_TAG="v$((MAJOR + 1)).0.0"
          elif [ "$BUMP" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "Error: custom_version cannot be empty when bump=custom" >&2
              exit 1
            fi
            if [[ ! "$CUSTOM" =~ ^v ]]; then
              NEW_TAG="v${CUSTOM}"
            else
              NEW_TAG="${CUSTOM}"
            fi
          fi

          echo "Computed new tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and Push Tag
        env:
          NEW_TAG: ${{ steps.semver.outputs.new_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "✅ Successfully created and pushed tag $NEW_TAG"
