name: Release Pipeline

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Build Tools & Dependencies
        run: |
          pip install build
          npm run install:all

      - name: Build Bundled Python Package (Wheel & Sdist)
        run: |
          npm run build:package

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true  # Allow release to succeed if PyPI credentials/Trusted Publishing are not yet configured
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  build-standalone-binaries:
    needs: build-and-publish-pypi
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: jotter-server-linux-amd64
            binary_name: jotter-server
          - os: windows-latest
            artifact_name: jotter-server-windows-amd64
            binary_name: jotter-server.exe
          - os: macos-latest
            artifact_name: jotter-server-darwin-amd64
            binary_name: jotter-server
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies & PyInstaller
        shell: bash
        run: |
          pip install pyinstaller .
          npm run install:all

      - name: Build Frontend
        shell: bash
        run: |
          npm run build:frontend

      - name: Build Standalone Binary with PyInstaller
        shell: bash
        run: |
          pyinstaller jotter.spec --clean --distpath dist-bin

      - name: Archive and Upload Binary to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.artifact_name }}.zip" "${{ matrix.binary_name }}"
            gh release upload "${{ github.ref_name }}" "${{ matrix.artifact_name }}.zip" --clobber
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"
            gh release upload "${{ github.ref_name }}" "${{ matrix.artifact_name }}.tar.gz" --clobber
          fi
