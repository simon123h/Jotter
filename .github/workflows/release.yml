name: Release Pipeline

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic Version Bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom Version (only if "custom" selected above, e.g. v3.1.0-rc.1)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  tag-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag
        id: resolve_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag push: $TAG"
          else
            # Triggered via workflow_dispatch button -> compute next semver
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v3.0.0"
            fi
            echo "Latest stable tag: $LATEST_TAG"

            RAW_VER="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RAW_VER"

            BUMP="${{ github.event.inputs.bump }}"
            CUSTOM="${{ github.event.inputs.custom_version }}"

            if [ "$BUMP" = "patch" ]; then
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            elif [ "$BUMP" = "minor" ]; then
              TAG="v${MAJOR}.$((MINOR + 1)).0"
            elif [ "$BUMP" = "major" ]; then
              TAG="v$((MAJOR + 1)).0.0"
            elif [ "$BUMP" = "custom" ]; then
              if [ -z "$CUSTOM" ]; then
                echo "Error: custom_version cannot be empty when bump=custom" >&2
                exit 1
              fi
              if [[ ! "$CUSTOM" =~ ^v ]]; then
                TAG="v${CUSTOM}"
              else
                TAG="${CUSTOM}"
              fi
            fi

            echo "Computed new tag: $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-publish-pypi:
    needs: tag-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag-release.outputs.tag }}

      - name: Fetch All Tags
        run: |
          git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Build Tools & Dependencies
        run: |
          pip install build
          npm run install:all

      - name: Build Bundled Python Package (Wheel & Sdist)
        env:
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${TAG#v}"
          echo "Building package for release version: $SETUPTOOLS_SCM_PRETEND_VERSION"
          npm run build:package

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          EXTRA_FLAGS=()

          # If the tag contains alpha, beta, rc, or dev -> mark as GitHub pre-release
          if [[ "$TAG" =~ (alpha|beta|rc|dev|[0-9]+[ab][0-9]+) ]]; then
            EXTRA_FLAGS+=(--prerelease)
            START_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            # For a stable release, find the most recent previous STABLE tag (ignoring alpha/beta/rc tags)
            START_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
            if [ -z "$START_TAG" ]; then
              START_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            fi
          fi

          RANGE="${START_TAG}..${TAG}"
          if [ -z "$START_TAG" ]; then
            RANGE="${TAG}"
          fi

          REPO_URL="https://github.com/${{ github.repository }}"
          NOTES_FILE="/tmp/release_notes.md"
          echo "## What's Changed" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"

          FEATS=$(git log "$RANGE" --grep="^feat" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          FIXES=$(git log "$RANGE" --grep="^fix" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          MAINT=$(git log "$RANGE" --grep="^chore" --grep="^perf" --grep="^refactor" --grep="^docs" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          OTHER=$(git log "$RANGE" --invert-grep --grep="^feat" --grep="^fix" --grep="^chore" --grep="^perf" --grep="^refactor" --grep="^docs" --grep="^style" --grep="^test" --grep="^Merge" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)

          HAS_CONTENT=false

          if [ -n "$FEATS" ]; then
            echo "### 🚀 Features" >> "$NOTES_FILE"
            echo "$FEATS" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            HAS_CONTENT=true
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> "$NOTES_FILE"
            echo "$FIXES" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            HAS_CONTENT=true
          fi

          if [ -n "$MAINT" ]; then
            echo "### 🧰 Maintenance & Dependencies" >> "$NOTES_FILE"
            echo "$MAINT" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            HAS_CONTENT=true
          fi

          if [ -n "$OTHER" ]; then
            echo "### 📦 Other Changes" >> "$NOTES_FILE"
            echo "$OTHER" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            HAS_CONTENT=true
          fi

          if [ "$HAS_CONTENT" = false ]; then
            git log "$RANGE" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" >> "$NOTES_FILE" || true
            echo "" >> "$NOTES_FILE"
          fi

          if [ -n "$START_TAG" ]; then
            echo "**Full Changelog**: $REPO_URL/compare/${START_TAG}...${TAG}" >> "$NOTES_FILE"
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            "${EXTRA_FLAGS[@]}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true  # Allow release to succeed if PyPI credentials/Trusted Publishing are not yet configured
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  build-standalone-binaries:
    needs: [tag-release, build-and-publish-pypi]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: jotter-server-linux-amd64
            binary_name: jotter-server
          - os: windows-latest
            artifact_name: jotter-server-windows-amd64
            binary_name: jotter-server.exe
          - os: macos-latest
            artifact_name: jotter-server-macos-arm64
            binary_name: jotter-server
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag-release.outputs.tag }}

      - name: Fetch All Tags
        run: |
          git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies & PyInstaller
        shell: bash
        env:
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${TAG#v}"
          pip install pyinstaller .
          npm run install:all

      - name: Build Frontend
        shell: bash
        run: |
          npm run build:frontend

      - name: Build Standalone Binary with PyInstaller
        shell: bash
        env:
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${TAG#v}"
          pyinstaller jotter.spec --clean --distpath dist-bin

      - name: Archive and Upload Binary to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          cd dist-bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.artifact_name }}.zip" "${{ matrix.binary_name }}"
            gh release upload "$TAG" "${{ matrix.artifact_name }}.zip" --clobber
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"
            gh release upload "$TAG" "${{ matrix.artifact_name }}.tar.gz" --clobber
          fi

  build-android-apk:
    needs: [tag-release, build-and-publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.tag-release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Assets & Sync Capacitor
        run: |
          cd frontend
          npm run build
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Android APK
        shell: bash
        env:
          TAG: ${{ needs.tag-release.outputs.tag }}
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'jotterapp' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'jotter' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'jotterapp' }}
        run: |
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "Using persistent release keystore from repository secret ANDROID_RELEASE_KEYSTORE_BASE64..."
            python3 -c "import os, base64; open('release.keystore', 'wb').write(base64.b64decode(os.environ['CUSTOM_KEYSTORE_BASE64'].strip()))"
          else
            echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not set. Generating temporary keystore for this build..."
            keytool -genkeypair -v -keystore release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Jotter, OU=Mobile, O=Jotter, L=Local, ST=Local, C=DE"
          fi
          
          APK_RAW=$(find frontend/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          SIGNED_APK="jotter-${TAG}-android.apk"
          
          # Align & Sign APK using Android Build-Tools apksigner
          BUILD_TOOLS_BIN=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_BIN/zipalign" -v -p 4 "$APK_RAW" "${APK_RAW}.aligned"
          "$BUILD_TOOLS_BIN/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEY_PASSWORD" \
            --out "$SIGNED_APK" "${APK_RAW}.aligned"
          
          "$BUILD_TOOLS_BIN/apksigner" verify "$SIGNED_APK"
          echo "SIGNED_APK=$SIGNED_APK" >> "$GITHUB_ENV"

      - name: Upload Signed APK to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tag-release.outputs.tag }}
        run: |
          if [ -f "$SIGNED_APK" ]; then
            gh release upload "$TAG" "$SIGNED_APK" --clobber
          else
            echo "Warning: No signed APK found to upload."
          fi

