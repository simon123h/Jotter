name: Release Pipeline

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Build Tools & Dependencies
        run: |
          pip install build shiv
          npm run install:all

      - name: Build Bundled Python Package (Wheel & Sdist)
        run: |
          npm run build:package

      - name: Build Standalone ZipApp (jotter.pyz)
        run: |
          shiv -e backend.main:main -o dist/jotter.pyz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true  # Allow release to succeed if PyPI credentials/Trusted Publishing are not yet configured
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true
