name: Release Pipeline

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write  # Required for PyPI Trusted Publishing (OIDC)

jobs:
  build-and-publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Build Tools & Dependencies
        run: |
          pip install build
          npm run install:all

      - name: Build Bundled Python Package (Wheel & Sdist)
        run: |
          npm run build:package

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          EXTRA_FLAGS=()

          # If the tag contains alpha, beta, rc, or dev -> mark as GitHub pre-release
          if [[ "$TAG" =~ (alpha|beta|rc|dev|[0-9]+[ab][0-9]+) ]]; then
            EXTRA_FLAGS+=(--prerelease)
            START_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            # For a stable release, find the most recent previous STABLE tag (ignoring alpha/beta/rc tags)
            START_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$" | head -n 1 || true)
            if [ -z "$START_TAG" ]; then
              START_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
            fi
          fi

          RANGE="${START_TAG}..${TAG}"
          if [ -z "$START_TAG" ]; then
            RANGE="${TAG}"
          fi

          REPO_URL="https://github.com/${{ github.repository }}"
          NOTES_FILE="/tmp/release_notes.md"
          echo "## What's Changed" > "$NOTES_FILE"
          echo "" >> "$NOTES_FILE"

          FEATS=$(git log "$RANGE" --grep="^feat" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          FIXES=$(git log "$RANGE" --grep="^fix" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          MAINT=$(git log "$RANGE" --grep="^chore" --grep="^perf" --grep="^refactor" --grep="^docs" --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)
          OTHER=$(git log "$RANGE" --invert-grep --grep="^feat" --grep="^fix" --grep="^chore" --grep="^perf" --grep="^refactor" --grep="^docs" --grep="^style" --grep="^test" --grep="^Merge " --pretty=format:"* %s ([%h]($REPO_URL/commit/%H))" || true)

          if [ -n "$FEATS" ]; then
            echo "### 🚀 Features" >> "$NOTES_FILE"
            echo "$FEATS" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> "$NOTES_FILE"
            echo "$FIXES" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          fi

          if [ -n "$MAINT" ]; then
            echo "### 🧰 Maintenance & Dependencies" >> "$NOTES_FILE"
            echo "$MAINT" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          fi

          if [ -n "$OTHER" ]; then
            echo "### 📦 Other Changes" >> "$NOTES_FILE"
            echo "$OTHER" >> "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
          fi

          if [ -n "$START_TAG" ]; then
            echo "**Full Changelog**: $REPO_URL/compare/${START_TAG}...${TAG}" >> "$NOTES_FILE"
          fi

          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            "${EXTRA_FLAGS[@]}"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true  # Allow release to succeed if PyPI credentials/Trusted Publishing are not yet configured
        with:
          packages-dir: dist/
          skip-existing: true
          print-hash: true

  build-standalone-binaries:
    needs: build-and-publish-pypi
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: jotter-server-linux-amd64
            binary_name: jotter-server
          - os: windows-latest
            artifact_name: jotter-server-windows-amd64
            binary_name: jotter-server.exe
          - os: macos-latest
            artifact_name: jotter-server-darwin-amd64
            binary_name: jotter-server
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies & PyInstaller
        shell: bash
        run: |
          pip install pyinstaller .
          npm run install:all

      - name: Build Frontend
        shell: bash
        run: |
          npm run build:frontend

      - name: Build Standalone Binary with PyInstaller
        shell: bash
        run: |
          pyinstaller jotter.spec --clean --distpath dist-bin

      - name: Archive and Upload Binary to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-bin
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${{ matrix.artifact_name }}.zip" "${{ matrix.binary_name }}"
            gh release upload "${{ github.ref_name }}" "${{ matrix.artifact_name }}.zip" --clobber
          else
            tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.binary_name }}"
            gh release upload "${{ github.ref_name }}" "${{ matrix.artifact_name }}.tar.gz" --clobber
          fi
