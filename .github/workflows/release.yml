name: Release Pipeline

on:
  push:
    tags:
      - '*'

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Wails Application
        uses: wailsapp/wails-gh-action@v2
        with:
          wails-version: 'v2.12.0'

      - name: Prepare Release Files
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp build/bin/jotter.exe dist/
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp build/bin/jotter dist/
          fi
          cp README.md dist/
          cp LICENSE.md dist/
          cp docs/assets/jotter.sample.yaml dist/jotter.yaml

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf jotter-${{ github.ref_name }}-linux.tar.gz jotter README.md LICENSE.md jotter.yaml

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd build/bin
          zip -r ../../dist/jotter-${{ github.ref_name }}-macos.zip jotter.app

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path jotter.exe, README.md, LICENSE.md, jotter.yaml -DestinationPath jotter-${{ github.ref_name }}-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jotter-binaries-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jotter-binaries-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jotter-*.tar.gz
            dist/jotter-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
