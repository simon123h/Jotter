name: Release Pipeline

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Pre-create frontend dist for Go embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Build Wails Application
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            wails build -tags webkit2_41 -ldflags "-X jotter/backend/internal/app.Version=${{ github.ref_name }}"
          else
            wails build -ldflags "-X jotter/backend/internal/app.Version=${{ github.ref_name }}"
          fi

      - name: Build Server Binary
        shell: bash
        run: |
          # The frontend was already built by wails build above
          if [ "${{ matrix.platform }}" = "windows" ]; then
            go build -ldflags "-X jotter/backend/internal/app.Version=${{ github.ref_name }}" -o build/bin/jotter-server.exe main_server.go shared_assets.go
          else
            go build -ldflags "-X jotter/backend/internal/app.Version=${{ github.ref_name }}" -o build/bin/jotter-server main_server.go shared_assets.go
          fi

      - name: Prepare Release Files
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            cp build/bin/jotter-desktop.exe dist/
            cp build/bin/jotter-server.exe dist/
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            cp build/bin/jotter-desktop dist/
            cp build/bin/jotter-server dist/
          fi
          cp README.md dist/
          cp LICENSE.md dist/
          cp docs/assets/jotter.sample.yaml dist/jotter.yaml

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd dist
          tar -czf jotter-${{ github.ref_name }}-linux.tar.gz jotter-server jotter-desktop README.md LICENSE.md jotter.yaml

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd build/bin
          # For macOS, we zip the .app bundle and the CLI binary separately or together. 
          # Convention is usually to have the CLI inside or alongside.
          zip -r ../../dist/jotter-${{ github.ref_name }}-macos.zip jotter-desktop.app jotter-server

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path jotter-server.exe, jotter-desktop.exe, README.md, LICENSE.md, jotter.yaml -DestinationPath jotter-${{ github.ref_name }}-windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jotter-binaries-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 1

  release:
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jotter-binaries-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jotter-*.tar.gz
            dist/jotter-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
