name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Python Venv
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install All Dependencies
        run: |
          npm run install:all

      - name: Check Formatting
        run: |
          npm run format:check

      - name: Run Linters
        run: |
          npm run lint

      - name: Build Frontend
        run: |
          npm run build

      - name: Run Tests and Generate Combined Coverage
        run: |
          npm run test:coverage
