name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - '*'
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            apps/mobile/node_modules
            packages/vault-format/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/web/package-lock.json', 'apps/mobile/package-lock.json', 'packages/vault-format/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          pip install -e .[dev]
          npm run install:all

      - name: Check Formatting
        run: |
          npm run format:check

      - name: Run Linters
        run: |
          npm run lint

      - name: Type Check
        run: |
          npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            apps/mobile/node_modules
            packages/vault-format/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/web/package-lock.json', 'apps/mobile/package-lock.json', 'packages/vault-format/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          pip install -e .[dev]
          npm run install:all

      - name: Run Backend Tests with Coverage
        run: |
          python3 -m pytest --cov=src/jotter --cov-report=xml --cov-report=term tests/

      - name: Run Web Tests with Coverage
        run: |
          cd apps/web && npm run test:coverage

      - name: Run Mobile Tests with Coverage
        run: |
          cd apps/mobile && npm run test:coverage

      - name: Run Shared Package Tests with Coverage
        run: |
          cd packages/vault-format && npm run test:coverage

      - name: Make Coverage Paths Relative to the Repository
        run: |
          node scripts/lcov-paths.mjs apps/web apps/web/coverage/lcov.info
          node scripts/lcov-paths.mjs apps/mobile apps/mobile/coverage/lcov.info
          node scripts/lcov-paths.mjs packages/vault-format packages/vault-format/coverage/lcov.info

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          disable_search: true
          # A failed upload fails the run on main; pull requests from forks have no token
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Web Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/web/coverage/lcov.info
          flags: web
          disable_search: true
          # A failed upload fails the run on main; pull requests from forks have no token
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Mobile Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          disable_search: true
          # A failed upload fails the run on main; pull requests from forks have no token
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

      - name: Upload Shared Package Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/vault-format/coverage/lcov.info
          flags: packages
          disable_search: true
          # A failed upload fails the run on main; pull requests from forks have no token
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/web/node_modules
            apps/mobile/node_modules
            packages/vault-format/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'apps/web/package-lock.json', 'apps/mobile/package-lock.json', 'packages/vault-format/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          pip install -e .[dev]
          npm run install:all

      - name: Cache Playwright Binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: |
          cd apps/web
          npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 2

  build-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          pip install build
          npm run install:all

      - name: Build Frontend & Python Distribution
        run: |
          npm run build:web
          python3 -m build

      - name: Build Jotter Web Assets
        run: |
          cd apps/mobile && npm run build
