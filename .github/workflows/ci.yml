name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          npm run install:all

      - name: Check Formatting
        run: |
          npm run format:check

      - name: Run Linters
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/hello.txt
          npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          npm run install:all

      - name: Run Tests and Generate Combined Coverage
        run: |
          npm run test:coverage

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          npm run install:all

      - name: Cache Playwright Binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build Frontend
        run: |
          cd frontend && npm run build

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 15

  build-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: 'go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        run: |
          npm run install:all

      - name: Build Frontend
        run: |
          cd frontend && npm run build

      - name: Verify Binary Compilation
        run: |
          # Verify server binary
          go build -v -o /dev/null main_server.go shared_assets.go
          
          # Prepare metadata and icons for desktop verification
          mkdir -p build/windows build/darwin
          cp docs/assets/icon.png build/appicon.png
          cp docs/assets/icon.ico build/windows/icon.ico
          cp docs/assets/icon.png build/darwin/icon.png
          
          cat <<EOF > build/windows/info.json
          {
            "companyName": "Jotter",
            "productName": "Jotter",
            "productVersion": "ci-build",
            "copyright": "simon123h@users.noreply.github.com"
          }
          EOF
          
          cat <<EOF > build/darwin/info.json
          {
            "bundleIdentifier": "com.jotter.app",
            "productName": "Jotter",
            "productVersion": "ci-build",
            "copyright": "simon123h@users.noreply.github.com"
          }
          EOF

          # Verify desktop binary (using wails tags)
          go build -v -tags wails -o /dev/null main_desktop.go shared_assets.go
