name: Deploy to GitHub Pages

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install All Dependencies
        shell: bash
        run: |
          npm install
          cd frontend && npm install

      - name: Build Docs and Frontend Demo
        shell: bash
        run: |
          npm run docs:build
          cd frontend && npm run build
          cd ..
          mkdir -p dist-pages
          cp -R docs/.vitepress/dist/. dist-pages/
          mkdir -p dist-pages/demo
          cp -R frontend/dist/. dist-pages/demo/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - name: Deploy to GitHub Pages
          # Identical deployment step
        id: deployment
        uses: actions/deploy-pages@v4
