coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1.0%
    patch:
      default:
        informational: true
  range: "50...75"

# Coverage comes from four uploads: the Python backend (flag backend), the web app (web), the mobile app (mobile) and
# the shared packages (packages). The shared packages are also covered by the tests of the two apps.
flags:
  backend:
    paths:
      - src/
  web:
    paths:
      - apps/web/
      - packages/
  mobile:
    paths:
      - apps/mobile/
      - packages/
  packages:
    paths:
      - packages/

ignore:
  - "apps/*/dist/**/*"
  - "apps/mobile/android/**/*"
  - "**/*.spec.ts"
  - "**/test-setup.ts"
  - "tests/**/*"
  - "scripts/**/*"
  - "docs/**/*"
