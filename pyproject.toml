[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jotter-app"
dynamic = ["version"]
description = "Local-first Markdown Kanban Board web application"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Simon" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "setuptools-scm>=8.0",
    "mcp>=1.0.0",
]

[project.scripts]
jotter = "jotter.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jotter" = ["dist/**/*", "dist/*"]

[tool.setuptools_scm]
write_to = "src/jotter/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "venv",
    "node_modules",
    "frontend",
    "docs",
    "backend/_version.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
